[project]
name = "tesis"
version = "0.1.0"
description = "LLM-Based Autonomous Web Penetration Testing Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "networkx>=3.2.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
evasion = ["deepteam>=0.2.0,<0.3.0"]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
tesis = "tesis.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
