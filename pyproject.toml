[project]
name = "tesis"
version = "0.1.0"
description = "LLM-Based Autonomous Web Penetration Testing Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.1",
    "langgraph>=1.2.1",
    "langchain-google-genai>=4.2.3",
    "langchain-openai>=1.2.2",
    "langchain-anthropic>=1.4.3",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "networkx>=3.6.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=6.0.0",
    "ruamel-yaml>=0.18.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
tesis = "tesis.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
