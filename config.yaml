# =============================================================================
# TESIS Runtime Configuration
# =============================================================================
# This configuration document is consumed by the interactive application and
# by `python -m tesis run --dry-run --config config.yaml`. Single and matrix
# overrides are selected in the TUI; dry runs perform only local validation.
#
# Environment variables (TESIS_*) may override values at runtime.
# =============================================================================

# -----------------------------------------------------------------------------
# Target & baseline defaults
# -----------------------------------------------------------------------------
# Target DVWA base URL.
target_url: http://172.19.48.1/dvwa

# Legacy-compatible defaults used when `level` / `provider` are not explicitly set.
default_security_level: low
# default_llm_provider: tokenharbor__deepseek-v4-1-flash_eb1394ac7fc4
default_max_iterations: 30

# Supported levels (also used by matrix mode defaults).
security_levels:
  - low
  - medium
  - high

# -----------------------------------------------------------------------------
# Primary run settings (single run mode)
# -----------------------------------------------------------------------------
# Explicit model-profile ID/level/surface for non-matrix runs.
# If omitted, loader falls back to default_* keys above.
# tokenharbor / deepseek-v4.1-flash (generated from api_providers below).
provider: river-ai__deepseek-ai-deepseek-v4-1-flash-1017_15efb2abf693
level: low
surface: sqli
payload_mode: static_only
candidate_budget: 10

# Max LangGraph orchestration iterations for a run.
iterations: 10

# Number of repeated runs per provider/level (mainly relevant for matrix mode).
repeats: 1

# Output root directory for artifacts.
# Runs go to:   <output_dir>/runs/
# Reports go to: <output_dir>/reports/
output_dir: results

# Report format for generated summaries.
# Options: json | markdown | both
report_format: both

# -----------------------------------------------------------------------------
# Stage 7.1 experiment controls (rich reporting + stopping policy)
# -----------------------------------------------------------------------------
# Default thesis experiment condition. Headless and TUI runs inherit this
# unless an explicit condition override is supplied.
experiment_condition: akg_guided_hybrid

# Whether to emit sidecar artifacts:
#   - <execution_id>.events.jsonl
#   - <execution_id>.rich.json
#   - <execution_id>.failure.json (error-only)
enriched_reporting: true

# Add run diagnostics into report summary (coverage/flags).
diagnose: true

# Stop policy:
#   - impact   => stop when high-impact outcome reached
#   - coverage => continue until coverage_target (or budget exhausted)
stop_policy: coverage

# Coverage goal (0.0..1.0) used when stop_policy=coverage.
coverage_target: 0.70

# -----------------------------------------------------------------------------
# Stage 8: Guardrail Retry / Refusal Handling
# -----------------------------------------------------------------------------
# Enable technical retry handling for schema-safe prompt clarification.
# Refusals are logged and fall back to AKG/static seed behavior.
guardrail_retry:
  enabled: true

  # Guardrail handling mode:
  #   - reactive  => only clarify after a guardrail refusal is detected
  #   - proactive => always rewrite prompts before sending
  mode: reactive

  # Maximum clarification attempts per guard-railed prompt.
  # Provider rate limits use llm_runtime.rate_limit_retries below.
  max_retries: 3

  # Number of consecutive clean (non-refused) responses before suppressing
  # the pre-check to reduce latency.
  cooldown_threshold: 5

# -----------------------------------------------------------------------------
# Matrix mode settings
# -----------------------------------------------------------------------------
# Set true to run across selected model profiles x levels x surfaces x payload
# modes x repeats, using experiment_condition above.
matrix: false

# Model-profile IDs and levels to use in matrix mode. Each provider/model pair
# has its own coordinate, even when pairs share an API protocol or endpoint.
# Keep providers and levels nonempty when matrix mode is enabled.
providers: []
  # - opencode__gpt-5-6-luna_e33230db3dd7

levels:
  - low
  - medium
  - high

surfaces:
  - sqli
  - access_control
  - brute_force

payload_modes:
  - static_only
  - hybrid

# -----------------------------------------------------------------------------
# LLM runtime acceleration
# -----------------------------------------------------------------------------
# Role settings inherit provider, endpoint, credentials, timeout, and defaults
# from their resolved profile. With no global or role profile, an unpinned role
# follows each matrix coordinate's provider. Explicit role > global profile >
# coordinate provider; the role temperature overrides the model default.
# `auto` uses native structured output when supported and otherwise uses the
# compact JSON prompt.
llm_runtime:
  max_concurrency: 2
  cache_scope: run

  # Provider-agnostic rate-limit handling for both runtime roles (HTTP 429).
  # Separate from guardrail_retry: resend the same request after waiting.
  # Additional attempts after the first request; 0 disables runtime retries.
  rate_limit_retries: 3
  # Retry window in seconds; no new retry starts after this window.
  # Waits are 10/20/40 seconds + jitter, or longer if the provider asks.
  # An in-flight request still follows its configured request timeout.
  rate_limit_retry_budget_s: 120
  # SDK retries default to 0. A positive model extra.max_retries takes
  # ownership instead, disabling this runtime retry loop for that model.

  # Optional run-time override (does not need to be written here):
  # python -m tesis run --headless --mode single --model-profile opencode__gpt-5-6-luna_e33230db3dd7
  # The CLI/TUI selector applies one resolved model profile to both roles.
  # Leave global and role model_profile pins unset for provider/model matrices.

  roles:
    orchestrator:
      temperature: 0
      # Shared ceiling includes reasoning and the final structured response.
      max_tokens: 8192
      structured_output: auto

    payload_generator:
      temperature: 0
      # Leave room for reasoning before the final payload JSON.
      max_tokens: 8192
      structured_output: auto

# -----------------------------------------------------------------------------
# Optional DVWA credentials (if your runtime/session manager uses them)
# -----------------------------------------------------------------------------
dvwa_username: admin
dvwa_password: password

# -----------------------------------------------------------------------------
# API providers: independent credentials/endpoints and multiple models
# -----------------------------------------------------------------------------
# Protocols: openai (Responses), openai_compatible (Chat Completions),
# anthropic (Messages). Provider IDs identify services, independently of their
# protocol. Register more providers using distinct IDs, even for the same API.
# Keep keys in the colocated .env; YAML contains only environment references.
# Add only model IDs actually available at the configured endpoint.
# See docs/reference/api_providers.md for discovery and profile-ID inspection.
api_providers:

  # Optional second provider using the Responses protocol. Configure its key
  # and model IDs before uncommenting; add generated IDs to providers above.
  # openai_api:
  #   display_name: OpenAI API
  #   protocol: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_DIRECT_API_KEY}
  #   models:
  #     - your-model-id
  #     - your-other-model-id
  #   timeout: 60

  # Optional Anthropic Messages provider. This example stays inactive so it
  # requires no additional credentials or model choices for existing runs.
  # anthropic_api:
  #   display_name: Anthropic API
  #   protocol: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key: ${ANTHROPIC_API_KEY}
  #   models:
  #     - your-model-id
  #     - your-other-model-id
  #   timeout: 60

  river-ai:
    display_name: river-ai
    base_url: https://api.river.ai/v1
    protocol: openai_compatible
    fetch_url: https://api.river.ai/v1/models
    models:
      - zai-org/GLM-5.3-Flash
      - deepseek-ai/DeepSeek-V4.1-Flash-1017
    api_key: ${TESIS_PROVIDER_RIVER_AI_8DE913F7_API_KEY}
# -----------------------------------------------------------------------------
# Additional model profiles: ChatGPT sign-in and legacy adapters
# -----------------------------------------------------------------------------
# API-key provider/model pairs above expand into models automatically.
# Keep standalone profiles here for Gemini or openai_codex_auth.
models:
  # ChatGPT sign-in profile for the second evaluated model (gpt-6-luna), used by
  # the coordinate you authorised on 2026-10-30. Reasoning effort is low per that
  # authorisation, which is a documented deviation from the v4 study's 'max'.
  openai_codex_auth:
    provider: openai_codex_auth
    model_name: gpt-6-luna
    timeout: 60
    reasoning_effort: low
    extra:
      account: default
  # To opt in, replace {} with the mapping below, sign in with
  # `.venv/bin/python -m tesis auth login --account default`, then select an
  # account model in Settings or `tesis auth models --account default`.
  # openai_codex_auth:
  #   provider: openai_codex_auth
  #   model_name: ""  # Set an actual model ID returned for your account.
  #   timeout: 60
  #   reasoning_effort: null
  #   extra:
  #     account: default
# Select openai_codex_auth explicitly as provider or in the providers list.
# Review global/role profile pins before selecting it. Tokens stay outside YAML.
# Its adapter omits temperature and output-token limits and records that
# limitation in telemetry. See docs/reference/sign_in_with_chatgpt.md.

# -----------------------------------------------------------------------------
# Frozen scoring evaluator (independent of the experiment's model coordinate)
# Use the same provider/model ID as the run and matrix selectors. Its entry owns
# the endpoint, API protocol, model ID, and credentials. Review limits are independent.
# -----------------------------------------------------------------------------
scoring_mode: ai
scoring_rubric_version: scoring.v4
scoring_profile: {}
scoring_oracles: config/oracles/dvwa-source-fee264766667580e5352.json
scoring_evaluator:
  max_attempts: 2
  # D9: frozen budget raised to 16K so no accepted review can have been produced
  # under a different (smaller) ceiling than the one recorded here.
  max_tokens: 16384
  timeout: 60
  # D10: the evaluator is deliberately outside the evaluated model set.
  provider: river-ai__zai-org-glm-5-3-flash_bc20d9347385
  reasoning_effort: high
# Exact model IDs. Provider catalog metadata takes precedence. Unknown models use the fallback picker and a support check.
# GLM and DeepSeek catalogs supplied by the user. GPT catalogs: official model docs, checked 2026-10-26.
# https://developers.openai.com/api/docs/models/gpt-6.1-sol
# https://developers.openai.com/api/docs/models/gpt-6-astra
# https://developers.openai.com/api/docs/models/gpt-6-luna
# https://developers.openai.com/api/docs/models/gpt-5.4
reasoning_catalog:
  zai-org/GLM-5.3-Flash: [low, high, xhigh]
  deepseek-ai/DeepSeek-V4.1-Flash-1017: [off, low, high, max]
  gpt-6.1-terra: [none, low, medium, high, xhigh, max]
  gpt-6.1-sol: [low, medium, high, xhigh, max]
  gpt-6-astra: [low, medium, high, xhigh, max]
  gpt-6-luna: [none, low, medium, high, xhigh, max]
  gpt-5.4: [none, low, medium, high, xhigh]
  gpt-6-sol: [none, low, medium, high, xhigh, max]
  gpt-5.6: [none, low, medium, high, xhigh, max]
  gpt-5.6-sol: [none, low, medium, high, xhigh, max]
  gpt-5.6-luna: [none, low, medium, high, xhigh, max]
fixture_id: dvwa-source-fee264766667580e5352
protocol_version: ranking-session-acceptance.v1

